version: "3.8"

services:
  # ---- PostgreSQL ----
  db:
    image: postgres:16-alpine
    container_name: worksense-db
    environment:
      POSTGRES_DB: worksense
      POSTGRES_USER: worksense
      POSTGRES_PASSWORD: worksense
    ports:
      - "5432:5432"
    volumes:
      - worksense_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worksense"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Backend (FastAPI) ----
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worksense-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://worksense:worksense@db:5432/worksense
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      BACKEND_CORS_ORIGINS: http://localhost:4200
      AI_USE_DEMO_DATA: "true"
      DEBUG: "false"
      APP_ENV: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # ---- Frontend (Angular) ----
  frontend:
    build:
      context: ../RendimientoFrontend
      dockerfile: Dockerfile
    container_name: worksense-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  worksense_pgdata:
